services:
  backend:
    build: ./backend
    container_name: failover-chat-backend
    ports:
      - "8000:8000"
    environment:
      # Required: comma-separated key pool (>= 2 keys). Key ids are key_1, key_2, ...
      LLM_API_KEYS: ${LLM_API_KEYS:?Set LLM_API_KEYS in .env (copy .env.example)}
      LLM_MODEL: ${LLM_MODEL:-gemini/gemini-3.5-flash-lite}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      # SQLite file lives on the named volume so history survives restarts.
      DATABASE_URL: sqlite:////data/app.db
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-0}
      KEY_COOLDOWN_SECONDS: ${KEY_COOLDOWN_SECONDS:-30}
      DEFAULT_SYSTEM_PROMPT: ${DEFAULT_SYSTEM_PROMPT:-You are a helpful, concise assistant. Answer clearly and accurately.}
    volumes:
      - sqlite-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: failover-chat-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite-data:
